# Profil "a4": klasické A4 PDF (třída article) – textová podoba materiálů.
# Použití: quarto render --profile a4 [--to pdf]
# Výstup: docs/r_mol_data_phylogen_a4.pdf (přejmenováno v post-render, Quarto
# pojmenuje výstupní PDF knihy podle titulu a na úrovni YML to přepsat nejde).
project:
  post-render:
    - python3 rename_pdf.py docs/Molecular-data-in-R.pdf docs/r_mol_data_phylogen_a4.pdf
format:
  pdf:
    documentclass: article
    pdf-engine: xelatex
    classoption: [a4paper, 11pt]
    geometry: [margin=2.5cm]
    top-level-division: section
    mainfont: "Linux Libertine O"
    sansfont: "Linux Biolinum O"
    monofont: "Linux Libertine Mono O"
    highlight-style: pygments
    toc: true
    number-sections: true
    variables:
      colorlinks: true
      linkcolor: Crimson
      anchorcolor: Magenta
      citecolor: Magenta
      filecolor: Magenta
      menucolor: Magenta
      urlcolor: DodgerBlue
      pdfsubject: "Course about phylogeny and evolution in R"
      pdfkeywords: "R, evolution, phylogeny, molecular data"
