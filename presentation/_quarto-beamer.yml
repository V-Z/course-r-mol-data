# Profil "beamer": prezentace jako PDF (beamer), vzhled co nejblíže původnímu
# r_mol_data_phylogen.pdf sestavenému z původního XeLaTeX zdroje.
# Použití: quarto render --profile beamer [--to pdf]
# Výstup: docs/r_mol_data_phylogen.pdf (přejmenováno v post-render, Quarto pojmenuje
# výstupní PDF knihy podle titulu a na úrovni YML to přepsat nejde).
project:
  post-render:
    - python3 rename_pdf.py docs/Molecular-data-in-R.pdf docs/r_mol_data_phylogen.pdf
format:
  pdf:
    documentclass: beamer
    pdf-engine: xelatex
    top-level-division: section
    classoption: [compress, 11pt, aspectratio=169, xcolor=svgnames]
    include-in-header: beamer-header.tex
    highlight-style: pygments
    toc: true
    number-sections: false
    institute: |
      Department of Botany, Faculty of Science, Charles University, Prague<br>
      Institute of Botany, Czech Academy of Sciences, Průhonice<br>
      <https://trapa.cz/>, [zeisek@natur.cuni.cz](mailto:zeisek@natur.cuni.cz)
    variables:
      subtitle: "Phylogeny, evolution \\& R"
      date: "February 2--5, 2026"
      colorlinks: true
      linkcolor: Crimson
      anchorcolor: Magenta
      citecolor: Magenta
      filecolor: Magenta
      menucolor: Magenta
      urlcolor: DodgerBlue
      pdfsubject: "Course about phylogeny and evolution in R"
      pdfkeywords: "R, evolution, phylogeny, molecular data"
      pdfcreator: "XeLaTeX"
