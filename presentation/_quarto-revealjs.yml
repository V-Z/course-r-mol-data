# Profil "revealjs": HTML prezentace (každá kapitola jako samostatná revealjs
# sada snímků), vzhled odvozený od "klasického" HTML knihy (lumen + Libertine).
# Pozor: kniha (book) revealjs nepodporuje, proto profil přepíná projekt na
# website – renderovat jen přes: quarto render --profile revealjs --to revealjs
# Výstup: docs-slides/
project:
  type: website
  output-dir: docs-slides
# Každá kapitola je samostatná revealjs prezentace (index.html, 01-chapter.html, ...).
website:
  title: "Molecular data in R"
format:
  revealjs:
    theme: simple
    css: slides.css
    logo: rlogo.jpg
    mainfont: "Linux Libertine Sans"
    monofont: "Linux Libertine Mono"
    scrollable: true
    slide-number: true
    code-line-numbers: true
    code-fold: show
    code-copy: true
    code-overflow: scroll
