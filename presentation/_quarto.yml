# Základní konfigurace: HTML "book" (více stránek podle kapitol) + export R skriptu.
# Další výstupní formáty jsou v profilech (_quarto-<profil>.yml):
#   quarto render                          -> docs/ HTML kniha + course_commands.r
#   quarto render --profile beamer         -> docs/r_mol_data_phylogen.pdf (beamer, jako původní XeLaTeX)
#   quarto render --profile revealjs --to revealjs -> docs-slides/ HTML prezentace (revealjs)
project:
  type: book
  output-dir: docs
  post-render:
    - python3 make_course_script.py
    - python3 rename_pdf.py docs/Molecular-data-in-R.pdf docs/r_mol_data_phylogen_a4.pdf
book:
  title: "Molecular data in R"
  subtitle: "Course about phylogeny and evolution in R"
  date: 2026-11-25
  author: "Vojtěch Zeisek"
  chapters:
    - index.qmd
    - 01-chapter.qmd
    - 02-chapter.qmd
    - 03-chapter.qmd
    - 04-chapter.qmd
    - 05-chapter.qmd
    - 06-chapter.qmd
    - 07-chapter.qmd
    - 08-chapter.qmd
    - 09-chapter.qmd
    - 10-chapter.qmd
    - 11-chapter.qmd
    - 12-chapter.qmd
    - 13-chapter.qmd
format:
  html:
    theme:
      light: lumen
      dark: darkly
    anchor-sections: true
    tabsets: true
    smooth-scroll: true
    respect-user-color-scheme: true
    toc: true
    toc-location: left
    number-sections: true
    mainfont: "Linux Libertine Sans"
    monofont: "Linux Libertine Mono"
    cap-location: bottom
    fig-cap-location: bottom
    tbl-cap-location: bottom
    title-block-banner: true
    title-block-banner-color: body
    code-fold: show
    code-overflow: scroll
    code-line-numbers: true
    code-copy: true
    code-tools: true
    fig-align: center
    link-external-icon: true
    link-external-newwindow: true
    bread-crumbs: true
    back-to-top-navigation: true
    page-navigation: true
  pdf:
    documentclass: article
    pdf-engine: xelatex
    classoption: [a4paper, 11pt]
    geometry: [margin=2.5cm]
    top-level-division: section
    mainfont: "Linux Libertine O"
    monofont: "Linux Libertine Mono O"
    highlight-style: pygments
    toc: true
    number-sections: true
    variables:
      colorlinks: true
      linkcolor: Crimson
      anchorcolor: Magenta
      citecolor: Magenta
      filecolor: Magenta
      menucolor: Magenta
      urlcolor: DodgerBlue
      pdfsubject: "Course about phylogeny and evolution in R"
      pdfkeywords: "R, evolution, phylogeny, molecular data"
execute:
  eval: false
  echo: true
lang: "en-US"
axe: true
keywords: "R, evolution, phylogeny, molecular data"
license: "BY-NC-SA"
