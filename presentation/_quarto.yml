---
# /usr/lib/rstudio/resources/app/bin/quarto/bin/quarto render
project:
  type: book
  output-dir: docs
  post-render:
    - python3 make_course_script.py
book:
  title: "Molecular data in R"
  output-file: r_mol_data_phylogen_a4
  downloads: [pdf]
  subtitle: "Course about phylogeny and evolution in R"
  date: 2026-11-25
  author: "Vojtěch Zeisek"
  chapters:
    - index.qmd
    - 01-chapter.qmd
    - 02-chapter.qmd
    - 03-chapter.qmd
    - 04-chapter.qmd
    - 05-chapter.qmd
    - 06-chapter.qmd
    - 07-chapter.qmd
    - 08-chapter.qmd
    - 09-chapter.qmd
    - 10-chapter.qmd
    - 11-chapter.qmd
    - 12-chapter.qmd
    - 13-chapter.qmd
format:
  html:
    theme:
      light: lumen
      dark: darkly
    anchor-sections: true
    tabsets: true
    smooth-scroll: true
    respect-user-color-scheme: true
    toc: true
    toc-location: left
    number-sections: true
    mainfont: "Linux Libertine Sans"
    monofont: "Linux Libertine Mono"
    cap-location: bottom
    fig-cap-location: bottom
    tbl-cap-location: bottom
    title-block-banner: true
    title-block-banner-color: body
    code-fold: show
    code-overflow: scroll
    code-line-numbers: true
    code-copy: true
    code-tools: true
    fig-align: center
    link-external-icon: true
    link-external-newwindow: true
    bread-crumbs: true
    back-to-top-navigation: true
    page-navigation: true
  pdf:
    pdf-engine: xelatex
    toc: true
    number-sections: true
    top-level-division: section
    mainfont: "Linux Libertine O"
    monofont: "Linux Libertine Mono O"
    fontsize: 11pt
    linkcolor: Crimson
    filecolor: Maroon
    citecolor: Maroon
    urlcolor: DodgerBlue
    toccolor: DarkRed
    colorlinks: true
    documentclass: report
    include-in-header:
      text: |
        \usepackage{fancyhdr}
        \pagestyle{fancy}
    papersize: A4
    geometry: [margin=2.5cm]
    code-line-numbers: true
    code-block-bg: Cornsilk
    syntax-highlighting: pygments
    variables:
      anchorcolor: Maroon
      menucolor: Maroon
execute:
  eval: false
  echo: true
lang: "en-US"
axe: true
keywords: "R, evolution, phylogeny, molecular data"
license: "BY-NC-SA"
